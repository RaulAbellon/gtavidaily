name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://gtavidaily.com

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar el contenido editorial
        run: npm run content:check

      - name: Lint
        run: npm run lint

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Tests unitarios
        run: npm run test

      - name: Build de producción
        run: npm run build

      - name: Prueba de humo sobre el servidor real
        run: |
          npm start > server.log 2>&1 &
          npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: Log del servidor si algo falla
        if: failure()
        run: cat server.log || true
