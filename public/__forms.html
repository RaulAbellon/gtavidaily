<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Formularios de GTA VI Daily</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!--
      Esqueleto estático para Netlify Forms. NO se enlaza desde ninguna parte y
      no lo ve nadie: existe porque Netlify detecta los formularios analizando el
      HTML estático del despliegue, y con Next.js el HTML de las páginas se sirve
      desde la función, no como fichero estático.

      Dos reglas que hay que respetar o los envíos fallan en silencio:
      1. Los nombres de los campos deben coincidir EXACTAMENTE con los que envía
         el formulario real (src/components/site/contact-form.tsx). Netlify
         valida los nombres contra el formulario registrado.
      2. En aplicaciones con SSR, el POST debe ir a ESTE fichero
         (/__forms.html), no a "/": la función de Next intercepta la raíz y el
         envío nunca llega al gestor de formularios.
    -->
    <form
      name="contacto"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contacto" />
      <p hidden>
        <label>No rellenes este campo <input name="bot-field" /></label>
      </p>
      <p><label>Nombre <input type="text" name="name" /></label></p>
      <p><label>Email <input type="email" name="email" /></label></p>
      <p><label>Asunto <input type="text" name="subject" /></label></p>
      <p><label>Mensaje <textarea name="message"></textarea></label></p>
    </form>

    <!-- Segundo formulario: aviso por correo el día del lanzamiento. -->
    <form
      name="avisos"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="avisos" />
      <p hidden>
        <label>No rellenes este campo <input name="bot-field" /></label>
      </p>
      <p><label>Email <input type="email" name="email" /></label></p>
      <p><label>Origen <input type="text" name="origen" /></label></p>
    </form>
  </body>
</html>
