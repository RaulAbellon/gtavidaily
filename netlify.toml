# Configuración de despliegue en Netlify.
#
# El plan gratuito (Starter) permite publicidad, así que este sitio puede
# monetizarse sin coste de alojamiento: la restricción de Netlify es facturar a
# terceros por alojar sus webs, no mostrar anuncios propios.
#
# El sitio es **completamente estático** (`output: "export"` en next.config.ts):
# `npm run build` deja los ficheros en `out/` y Netlify los publica tal cual. Ya
# no hay adaptador de Next que genere una función de SSR, así que `publish` sí se
# declara aquí (antes lo gestionaba el adaptador). Con esto, Netlify y Cloudflare
# sirven exactamente el mismo artefacto.

[build]
  # Validación del contenido (esquema, fuentes, categorías) antes de compilar.
  # Las pruebas, el lint y el typecheck los pasa el CI de GitHub Actions y se
  # pasan en local con `npm run check` antes de publicar.
  command = "npm run content:check && npm run build"
  publish = "out"

[build.environment]
  # Next.js 16 exige Node >= 20.9. Se fija la LTS para que el build no dependa
  # de la versión por defecto de la plataforma.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# ---------------------------------------------------------------------------
# Cabeceras de seguridad
#
# Se declaran aquí, en el CDN, además de en `next.config.ts`: así se aplican
# también a las respuestas que sirve la función de Next (no solo a los activos
# estáticos) y no dependen del comportamiento del adaptador. La CSP se mantiene
# idéntica a la de `next.config.ts`; hay una prueba que falla si divergen.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.googletagservices.com https://adservice.google.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.web3forms.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://adservice.google.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
